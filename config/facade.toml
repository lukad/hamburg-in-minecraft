[illumination]
# The textures are oblique aerial photographs: faces turned away from the sun, and most of
# the narrow Speicherstadt canyons, are dark and bluish (L* 15–30, b* ≈ −18), which hides
# the brick. Per building the reference color is the median of its brightest wall samples
# (L* at or above the `reference_percentile`), i.e. the material in sunlight. A face whose
# median L* is below the reference is shifted toward it, fully in L* and, in a* and b*, by
# (ΔL* / chroma_full_at) capped at 1. Differences within a face (windows) are kept. Glass
# detection uses the uncorrected colors.
enabled = true
reference_percentile = 0.65
# A building whose sunlit reference itself is darker than this has no usable color
# evidence (its whole texture is in shadow); its walls use the fallback wall material of
# config/blocks.toml [buildings], like untextured buildings. Windows and roofs still come
# from the texture.
min_reference_l = 40.0
# Fraction of the L* difference applied: lifting shadowed faces all the way to the sunlit
# reference makes them look washed out.
lightness_gain = 0.7
chroma_full_at = 30.0
# Haze in the aerial photos desaturates materials; corrected colors get this chroma gain.
chroma_gain = 1.3
# A voxel takes its face's dominant color (the face median, corrected) unless its own
# color differs from it by more than this CIEDE2000 distance; this keeps facades from
# speckling between palette blocks while real color changes (bands, bases) remain.
face_snap_de = 12.0

[windows]
# Never applied to a building's bottom row of voxels (its ground slab), whose side samples
# often show the street at the facade foot.
# A facade voxel becomes a window when it is darker (CIELAB L*) than the median of its
# source face by `delta_l`, and the same column of that face has such voxels on at least
# `min_stories` stories (windows repeat per floor; a single dark patch is a shadow or dirt).
delta_l = 18.0
min_stories = 2
block = "minecraft:light_gray_stained_glass"

[curtain_wall]
# Glazed buildings (curtain walls, e.g. the Elbphilharmonie). A wall sample is "dark
# glass-like" when L* ≤ max_l, |a*| ≤ max_abs_a and b* ≤ max_b. Shadow darkens only the
# sides facing away from the sun, while a glass building is dark all around: a building
# counts as glazed when at least `min_sides` of its four facing directions have at least
# `min_side_fraction` dark glass-like samples. In glazed buildings every dark glass-like
# voxel becomes `block`; elsewhere dark samples go to the palette or window detection.
max_l = 38.0
max_abs_a = 4.0
max_b = 0.0
# Glass reflecting the sky stays near neutral (Elbphilharmonie C* ≈ 2–13); deep shadow in
# narrow streets and canals casts strongly blue skylight on brick (Wasserschloss C* ≈ 18).
max_chroma = 14.0
min_sides = 3
min_side_fraction = 0.35
block = "minecraft:gray_stained_glass"
