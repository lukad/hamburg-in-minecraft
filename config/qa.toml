look_at = [564420.0, 5933300.0, 4.0]

[color]
# Roof color vs DOP20 2026 (CIEDE2000 between the top block's palette color and the 1 m
# orthophoto pixel), area-wide median over textured (LoD3) building columns. Typical
# medians are about 7 (untextured buildings, colored from the orthophoto itself: about 5).
roof_de2000_median_max = 10.0
# The area median is judged only over at least this many textured buildings (a golden
# tile with one or two says little).
min_textured_buildings = 20

[determinism]
# Tiles rebuilt from scratch in memory on every QA run and compared block by block with
# their region files on disk (determinism).
tiles = [[0, 0], [-2, 1]]

[performance]
# A tile is flagged when its last forced build took this many times its baseline time
# (config/perf_baseline.toml, `hhmc qa --set-baseline`).
slower_than = 1.25

