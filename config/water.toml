# OSM water structures are barriers too: at city scale the seeded fills would
# otherwise run through every lock and weir into regulated canals, polder ditches and the
# reaches above weirs. Prep reads lock gates, locks (lock=yes), weirs, sluice gates and
# dams from the pinned OSM extract and covers each with disks of this radius (m) along
# it; the water behind them gets its own level (median shoreline DGM1, unless seeded).
[osm_barriers]
lock_gate = 12.0
lock = 12.0
weir = 8.0
sluice_gate = 8.0
dam = 8.0

