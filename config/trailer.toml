# Trailer shots for `hhmc trailer`: a tour datapack that flies the player through every shot
# while Flashback records, and the Flashback editor state with one scene (camera
# keyframes, time of day, export range) per shot. Positions are EPSG:25832 E, N and m NHN
# (= block y). Landmark positions are from the pinned OSM extract.
#
# Each shot gets a window of `lead_s + seconds + tail_s` in the recording. The player is
# teleported halfway along the camera path at the window's start (chunks load during the lead);
# the camera runs from `lead_s` for `seconds` while the player stays put. Start the recording, then run `/function hhmc:tour`
# within a second or two.

# The player waits halfway along the camera path for the lead before the camera runs.
# `hhmc trailer --install` cuts one replay per shot from the recording and delivers the
# shot's chunks a second before its export starts, so the lead only has to let them all
# arrive (about 1300 at roughly 100 per second).
lead_s = 15.0
# Still camera exported before each shot; cut when joining the clips.
preroll_s = 2.0
tail_s = 3.0
# Paths are scaled about their middle to at most this length, so the camera stays within
# 150 m of the player: record and export at render distance 32.
max_path_m = 300.0

# Minecraft time of day for shots without their own: 0 = sunrise, 6000 = noon, 12000 =
# sunset.
time_of_day = 11000

